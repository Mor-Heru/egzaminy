<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Contact | Minimalism</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="up">
        <h1>minimalism</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">News</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="down">
        <h1>Formularz kontaktowy</h1>
    </div>
</header>

<main>
    <section class="left">
        <img src="OBRAZY/img1.jpg" alt="images1">
    </section>

    <section class="middle">
        <img src="OBRAZY/img2.jpg" alt="images2">
    </section>

    <section class="right">
        <form>
            <h2>Formularz Kontaktowy</h2>

            <input type="text" placeholder="Imię i nazwisko" required>
            <input type="email" placeholder="Email" required>
            <input type="tel" placeholder="Telefon">

            <select>
                <option>Wybierz klasę</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>

            <textarea placeholder="Wiadomość" required></textarea>

            <button type="submit">Wyślij</button>
        </form>
    </section>
</main>

<footer>
    <p>Minimalism</p>
</footer>

</body>
</html>
