<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacja paliw</title>
    <link rel="stylesheet" href="styl2.css">
</head>
<body>
    <header>
        <h1>Całodobowa stacja paliw</h1>
    </header>
    <nav>
        <a href="stacja.html"><img src="home.png"></a>
        <a href="obliczenia.html"><img src="znak.png"></a>
        <a href="kwerendy.txt">Pobierz dokumenty</a>
    </nav>
    <main>
        <section class="left">
            <h2>Orientacyjny koszt paliwa</h2>
            <label>Rodzaj paliwa (1-benzyna, 2-olej napędowy):<br>
            <input id="paliwo" type="number" min="1" max="2" step="1" required></label><br>
            <label>Ile litrów?<br>
            <input type="number" id="ilosc" required></label><br>
            <button onclick="oblicz()">OBLICZ</button>
            <p id="output"></p>
        </section>
        <section class="right">
            <img src="samochod.png" alt="samochód" class="car">
        </section>
    </main>
    <footer>
        <p>Stronę opracował: 00000</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
